# Alembic configuration for NetScope.
#
# The database location is NOT set here: migrations/env.py reads it from the app settings
# (NETSCOPE_DATABASE_PATH, default data/netscope.db relative to the working directory).
#
# The app applies pending migrations automatically at startup (with a backup first).
# Manual use, from backend/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe change"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Lint-fix and format new migration files with ruff.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
