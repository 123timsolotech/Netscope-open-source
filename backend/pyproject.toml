[project]
name = "netscope"
version = "0.1.0"
description = "NetScope: your home network, mapped."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "fastapi>=0.163",
    "httpx>=0.28",
    "icmplib>=3.0.4",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "uvicorn>=0.54",
]

[project.scripts]
netscope = "app.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4.1.post1,<1.5",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # naming
    "S",   # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is fine in tests
    "S105", # fake passwords in test data
    "S106",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "../scripts"]

# icmplib ships no type hints (M6); its few calls are wrapped in app/monitor/checks.py.
[[tool.mypy.overrides]]
module = ["icmplib", "icmplib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# async def tests run on their own event loop (pytest-asyncio, M6: the status monitor).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
